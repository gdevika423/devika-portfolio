<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>End-to-End AI-Assisted Publication Pipeline architecture</title>
<desc>A flowchart showing a spec triggering an AI draft, opened as a pull request, gated by human review, then published and fed into documentation health monitoring.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5B6168" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="820" fill="#FBF9F6"/>

<!-- Spec input -->
<rect x="270" y="20" width="140" height="44" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Spec input</text>
<line x1="340" y1="64" x2="340" y2="96" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- AI-assisted draft -->
<rect x="220" y="96" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="116" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#26215C">AI-assisted draft</text>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#3C3489">GPT-4o-mini generates first pass</text>
<line x1="340" y1="152" x2="340" y2="184" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- PR opened -->
<rect x="190" y="184" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="204" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#26215C">Pipeline opens a pull request</text>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#3C3489">new branch, real commit, nothing on main</text>
<line x1="340" y1="240" x2="340" y2="276" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Human review diamond -->
<polygon points="340,276 460,330 340,384 220,330" fill="#FDF1EB" stroke="#C2410C" stroke-width="0.5"/>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Human review</text>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#712B13">accuracy, voice, overclaim</text>
<text x="340" y="352" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#712B13">risk</text>

<!-- No branch -->
<text x="500" y="318" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B6168">no</text>
<line x1="460" y1="330" x2="558" y2="330" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="560" y="306" width="100" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="610" y="322" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="500" fill="#501313">PR closed</text>
<text x="610" y="338" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#791F1F">nothing publishes</text>

<!-- Yes branch -->
<text x="356" y="400" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B6168">yes</text>
<line x1="340" y1="384" x2="340" y2="420" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Human merges -->
<rect x="190" y="420" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="440" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#173404">Human merges the PR</text>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#27500A">the only path to publication</text>
<line x1="340" y1="476" x2="340" y2="508" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Hugo build -->
<rect x="220" y="508" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="528" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Hugo build &amp; deploy</text>
<text x="340" y="548" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#5F5E5A">same path as every other page</text>
<line x1="340" y1="564" x2="340" y2="596" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Page goes live -->
<rect x="260" y="596" width="160" height="44" rx="22" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="618" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#173404">Page goes live</text>
<line x1="340" y1="640" x2="340" y2="672" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Health monitoring -->
<rect x="170" y="672" width="340" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="692" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Enters health monitoring</text>
<text x="340" y="712" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#712B13">automatic — no separate integration</text>

<!-- Closing line -->
<text x="340" y="770" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-style="italic" font-size="13" fill="#5B6168">The pull request is the gate.</text>
<text x="340" y="790" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-style="italic" font-size="13" fill="#5B6168">There is no path from spec to live site that skips a human merge.</text>

</svg>
