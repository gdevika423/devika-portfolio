<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Release Notes Automation architecture</title>
<desc>A flowchart showing a batch of release tickets being synthesized into structured release notes by AI, gated by PM review via a pull request, then published and fed into documentation health monitoring.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5B6168" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="760" fill="#FBF9F6"/>

<!-- Release tickets -->
<rect x="220" y="20" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Release ticket batch</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#5F5E5A">one release, multiple tickets</text>
<line x1="340" y1="76" x2="340" y2="108" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- AI synthesis -->
<rect x="190" y="108" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#26215C">AI synthesizes structured notes</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#3C3489">five fixed sections, not free-form prose</text>
<line x1="340" y1="164" x2="340" y2="196" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Fixed template box -->
<rect x="150" y="196" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#E7E2DC" stroke-width="0.5"/>
<text x="340" y="216" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B6168">FIXED TEMPLATE</text>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#2C2C2A">What changed · Who is impacted</text>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#2C2C2A">How you should respond</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#2C2C2A">Known limitations · Rollout details</text>
<line x1="340" y1="296" x2="340" y2="328" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- PR opened -->
<rect x="190" y="328" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#26215C">Pipeline opens a pull request</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#3C3489">same gate proven in Publication Pipeline</text>
<line x1="340" y1="384" x2="340" y2="420" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- PM review diamond -->
<polygon points="340,420 460,474 340,528 220,474" fill="#FDF1EB" stroke="#C2410C" stroke-width="0.5"/>
<text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PM review</text>
<text x="340" y="480" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#712B13">impact, limitations,</text>
<text x="340" y="496" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#712B13">rollout accuracy</text>

<!-- No branch -->
<text x="500" y="462" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B6168">no</text>
<line x1="460" y1="474" x2="558" y2="474" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="560" y="450" width="100" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="610" y="466" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="500" fill="#501313">PR closed</text>
<text x="610" y="482" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#791F1F">nothing publishes</text>

<!-- Yes branch -->
<text x="356" y="544" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B6168">yes</text>
<line x1="340" y1="528" x2="340" y2="564" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- PM merges -->
<rect x="190" y="564" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="584" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#173404">PM merges the PR</text>
<text x="340" y="604" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#27500A">the only path to publication</text>
<line x1="340" y1="620" x2="340" y2="652" stroke="#5B6168" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Live -->
<rect x="220" y="652" width="240" height="44" rx="22" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="674" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#173404">Release notes go live</text>

<!-- Closing line -->
<text x="340" y="724" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-style="italic" font-size="13" fill="#5B6168">Synthesized across tickets, not listed one by one.</text>
<text x="340" y="744" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-style="italic" font-size="13" fill="#5B6168">A PM merge is still the only path to customer-ready notes.</text>

</svg>
